services:

  identity-db:
    image: postgres:16
    container_name: identity-db
    restart: always

    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - identity_postgres_data:/var/lib/postgresql/data

    networks:
      - microservices-network

