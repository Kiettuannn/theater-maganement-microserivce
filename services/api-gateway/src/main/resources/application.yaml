server:
  port: 8888

app:
  api-prefix: /api

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity_service
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                  - StripPrefix=1


