server:
  port: 8084
  servlet:
    context-path: /catalog

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://localhost:5434/catalog_db
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin123

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false  # Tắt để tránh LazyInitializationException và N+1 query
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 300000  # TTL mặc định: 5 phút (ms), bị override bởi RedisConfig.java

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
