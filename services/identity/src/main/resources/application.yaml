server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/identity_db
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true